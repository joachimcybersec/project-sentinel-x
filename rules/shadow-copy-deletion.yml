title: Shadow Copies Deleted via vssadmin or wmic
id: 9a2c7e5b-4f1d-4c86-a3b9-6e0d1f8c2a73
status: experimental
description: Detects deletion of Volume Shadow Copies with vssadmin or wmic, commonly done by ransomware before encryption.
author: Sentinel X project
date: 2026-11-22
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  sel_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  sel_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  condition: 1 of sel_*
falsepositives:
  - Backup software rotating its own shadow copies (verify the parent process)
level: critical
